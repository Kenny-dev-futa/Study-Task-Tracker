<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Task Tracker</title>
  <link rel="stylesheet" href="study task tracker.css">
  
</head>
<body>
  <main class="tracker">
    <h1>My Study Tasks</h1>
    <p>Plan your study session, one task at a time.</p>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Enter a study task...">
      <button type="submit">Add Task</button>
    </form>

    <p id="progress">Tasks completed: 0</p>

    <ul id="task-list"></ul>
  </main>
  <footer>&copy;ArchiWeb</footer>
  <script src="study task tracker.js"></script>
</body>
</html>
